name: docker

# Build and push the daemon container image to GHCR.
# Trigger:
#   - Tag push (v*)        — release.yml creates tags atomically; this fires
#     immediately after and produces a versioned image plus :latest.
#   - workflow_dispatch    — manual one-off rebuild (does not bump version).
#
# Image: ghcr.io/clawket/daemon
# Tags published:
#   - vX.Y.Z (full)
#   - X.Y.Z  (no v prefix, for tools that prefer SemVer)
#   - latest (only on tag pushes, never on dispatch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: clawket/daemon

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (--help)
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(echo '${{ steps.meta.outputs.tags }}' | head -n1 | sed 's|.*:||')"
          echo "Pulling $IMAGE for smoke test"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" --help
